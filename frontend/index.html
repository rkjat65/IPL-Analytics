<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="author" content="Crickrida" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!--
      Per-page description, canonical, Open Graph, and Twitter Card tags are
      injected by the <SEO> component (react-helmet-async) on every route —
      see frontend/src/components/SEO.jsx. The tags below are intentionally
      omitted here to avoid duplicate/conflicting tags in the rendered head;
      only the JSON-LD (site-wide entities) and <title> fallback stay static.
    -->

    <title>Crickrida | Cricket via Stats</title>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Crickrida",
      "alternateName": "CrickRida",
      "url": "https://crickrida.rkjat.in",
      "logo": "https://crickrida.rkjat.in/logo.png",
      "description": "Free IPL and T20 World Cup analytics built on ball-by-ball data: batting and bowling records, team and venue profiles, head-to-head stats and shareable stat cards.",
      "sameAs": [
        "https://twitter.com/Rkjat65"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "radhakishanjat65@gmail.com",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction (enables Google Sitelinks Searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Crickrida",
      "url": "https://crickrida.rkjat.in",
      "description": "Free IPL and T20 World Cup analytics: 1,200+ IPL matches ball by ball, batting and bowling records, head-to-head comparisons, interactive charts and a free stat-card studio.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://crickrida.rkjat.in/batting?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SportsOrganization — IPL -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsOrganization",
      "name": "Indian Premier League",
      "alternateName": "IPL",
      "sport": "Cricket",
      "url": "https://www.iplt20.com",
      "description": "The Indian Premier League (IPL) is a professional Twenty20 cricket league held annually in India. Crickrida provides in-depth analytics for all IPL seasons from 2008 to 2026."
    }
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4V7XW1QPZ8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4V7XW1QPZ8');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg-primary text-text-primary font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
