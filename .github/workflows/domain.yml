name: Caddy site config

# Owns crickrida.com's routing on the server. crickrida.com is one site:
#   /api, /app, /ipl and /t20-world-cup  -> the ipl-analytics container
#   the app's pre-merge addresses        -> the container, which 301s them
#   everything else                      -> the international archive (GitHub Pages)
# The retired crickrida.rkjat.in goes to the container, which 301s every page.
#
# The config is written to crickrida.caddy next to the main Caddyfile and
# imported from it; any older crickrida site blocks there are removed. The
# Caddyfile is backed up first and restored if validation or the smoke test fails.

on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/domain.yml ]
  workflow_dispatch:

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
    - name: Write and reload the crickrida Caddy config
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: crickrida.rkjat.in
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -eu
          CF=$(systemctl show caddy -p ExecStart --value | grep -o -- '--config [^ ;]*' | awk '{print $2}' | head -1)
          CF=${CF:-/etc/caddy/Caddyfile}
          SITE="$(dirname "$CF")/crickrida.caddy"
          stamp=$(date +%Y%m%d%H%M%S)
          sudo -n cp "$CF" "$CF.bak-$stamp"
          if sudo -n test -f "$SITE"; then sudo -n cp "$SITE" "$SITE.bak-$stamp"; fi

          sudo -n tee "$SITE" >/dev/null <<'CADDY'
          crickrida.com {
          	encode zstd gzip

          	# The app, its files and its API run in the ipl-analytics container.
          	@app path /api/* /app/* /ipl /ipl/* /t20-world-cup /t20-world-cup/* /sw.js /sitemap-ipl.xml /llms.txt
          	handle @app {
          		reverse_proxy 127.0.0.1:8000
          	}

          	# Addresses the app used before it moved under /ipl and /t20-world-cup.
          	# They never end in a slash or a file extension; the archive's pages do.
          	@legacy {
          		path_regexp ^/(dashboard|batting|bowling|venues|seasons|h2h|charts|pulse|matchups|phases|content-studio|fantasy|quiz|faq|image-credits|privacy|terms|account-deletion|admin|login|social|ask|player-impact)(/[^/]+)*$|^/(matches|teams|players)(/[^/]+)+$
          		not path *.json *.xml *.txt *.csv *.png *.svg *.webp *.jpg *.ico *.js *.css *.html *.parquet *.woff2
          	}
          	handle @legacy {
          		reverse_proxy 127.0.0.1:8000
          	}

          	# Everything else is the international archive, published on GitHub Pages.
          	handle {
          		reverse_proxy https://cricket.rkjat.in {
          			header_up Host cricket.rkjat.in
          			header_down Location ^https?://cricket\.rkjat\.in https://crickrida.com
          		}
          	}
          }

          crickrida.rkjat.in {
          	encode zstd gzip
          	reverse_proxy 127.0.0.1:8000
          }

          www.crickrida.com {
          	redir https://crickrida.com{uri} permanent
          }
          CADDY
          sudo -n sed -i 's/^          //' "$SITE"

          # Drop older crickrida site blocks and imports from the main Caddyfile, then import the managed file.
          sudo -n awk -v site="$SITE" '
            BEGIN { depth = 0; skip = 0 }
            {
              line = $0
              if (depth == 0 && !skip && line ~ /crickrida\.(com|rkjat\.in)/ && line ~ /\{[[:space:]]*$/) skip = 1
              if (!skip && line ~ "^[[:space:]]*import[[:space:]]+" site "[[:space:]]*$") next
              if (!skip && line ~ /^[[:space:]]*import[[:space:]]+crickrida\.caddy[[:space:]]*$/) next
              copy = line
              opens = gsub(/\{/, "{", copy)
              closes = gsub(/\}/, "}", copy)
              if (!skip) print
              depth += opens - closes
              if (skip && depth == 0) skip = 0
            }
            END { print ""; print "import " site }
          ' "$CF.bak-$stamp" | sudo -n tee "$CF" >/dev/null

          restore() {
            sudo -n cp "$CF.bak-$stamp" "$CF"
            if sudo -n test -f "$SITE.bak-$stamp"; then sudo -n cp "$SITE.bak-$stamp" "$SITE"; else sudo -n rm -f "$SITE"; fi
            sudo -n systemctl reload caddy || true
          }

          if ! sudo -n caddy validate --config "$CF" --adapter caddyfile; then
            echo "The new config failed validation. Restoring the backup." >&2
            restore
            exit 1
          fi
          sudo -n systemctl reload caddy
          sleep 3

          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --resolve "$1:443:127.0.0.1" "https://$1$2" || true)
            echo "$1$2 -> $code (want $3)"
            [ "$code" = "$3" ]
          }
          ok=1
          check crickrida.com /api/health 200 || ok=0
          check crickrida.com /ipl/dashboard 200 || ok=0
          check crickrida.com / 200 || ok=0
          check crickrida.com /dashboard 301 || ok=0
          check crickrida.rkjat.in /batting/Virat%20Kohli 301 || ok=0
          if [ "$ok" != 1 ]; then
            echo "Smoke test failed. Restoring the previous config." >&2
            restore
            exit 1
          fi
          echo "crickrida.com now serves the archive at the root and the app under /ipl and /t20-world-cup. Backup: $CF.bak-$stamp"
