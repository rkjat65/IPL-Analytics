name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/ipl-analytics:latest
        build-args: |
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          APP_RELEASE=${{ github.sha }}

    - name: Deploy to Oracle via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_FROM: ${{ secrets.SMTP_FROM }}
      with:
        # Deploy to the host currently serving the public site. The previous
        # ORACLE_IP secret can drift when an instance/IP is replaced.
        host: crickrida.rkjat.in
        # The current public host is an Ubuntu instance (confirmed by its SSH
        # banner); the retired Oracle Linux host used the `opc` account.
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM
        script: |
          set -e

          # Login to registry on the server
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # The host has accumulated superseded release layers. Remove only
          # images unused by running containers before downloading the next
          # release; named volumes (including user accounts) are untouched.
          docker image prune -af
          
          # Pull the latest image
          docker pull ghcr.io/${{ github.repository_owner }}/ipl-analytics:latest
          
          # Preserve accounts from deployments that predate the data volume.
          docker cp ipl-analytics:/app/backend/data/users.db /tmp/crickrida-users.db || true

          # Stop and remove old container
          docker stop ipl-analytics || true
          docker rm ipl-analytics || true

          docker volume create crickrida-data
          docker run --rm \
            -v crickrida-data:/data \
            -v /tmp:/backup \
            alpine sh -c 'if [ -f /backup/crickrida-users.db ] && [ ! -f /data/users.db ]; then cp /backup/crickrida-users.db /data/users.db; fi'
          
          # Run the new container on port 8000 (Caddy will proxy to this)
          docker run -d \
            --name ipl-analytics \
            --restart always \
            -p 8000:8000 \
            -e DUCKDB_PATH=/app/ipl.duckdb \
            -e AUTH_DB_PATH=/data/users.db \
            -e GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            -e SMTP_HOST \
            -e SMTP_PORT \
            -e SMTP_USERNAME \
            -e SMTP_PASSWORD \
            -e SMTP_FROM \
            -e PUBLIC_APP_URL=https://crickrida.rkjat.in \
            -v crickrida-data:/data \
            ghcr.io/${{ github.repository_owner }}/ipl-analytics:latest

          # Fail the deployment if the newly started container is not the
          # exact commit that triggered this workflow.
          for attempt in $(seq 1 30); do
            release=$(curl -fsS http://127.0.0.1:8000/api/health | sed -n 's/.*"release":"\([^"]*\)".*/\1/p' || true)
            if [ "$release" = "${{ github.sha }}" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Container did not start release ${{ github.sha }}" >&2
          docker logs --tail 100 ipl-analytics >&2 || true
          exit 1

    - name: Verify public deployment
      shell: bash
      run: |
        set -e
        for attempt in $(seq 1 30); do
          release=$(curl -fsS "https://crickrida.rkjat.in/api/health?release=${{ github.sha }}" | sed -n 's/.*"release":"\([^"]*\)".*/\1/p' || true)
          if [ "$release" = "${{ github.sha }}" ]; then
            echo "Public site is serving release $release"
            exit 0
          fi
          sleep 2
        done
        echo "Public site did not switch to release ${{ github.sha }}" >&2
        exit 1
